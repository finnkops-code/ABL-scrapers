# ============================================================
# ABL Scraper — standalone workflow
# ============================================================
# Runs the ABL (Australian Baseball League) schedule scraper on
# a schedule, then commits the updated JSON file back to this
# repo, only if something actually changed.
#
# HOW TO USE
# 1. Save this file as .github/workflows/abl-scraper.yml in this
#    repository (alongside abl_schedule_scraper.py at the repo
#    root).
# 2. Adjust the cron schedule below to however often you want
#    fresh ABL data (currently every 6 hours). The scraper only
#    needs the Python standard library, so no requirements.txt
#    or extra installs are required.
# ============================================================

name: ABL Scraper

on:
  schedule:
    # Runs every 6 hours. Adjust to taste, e.g. "0 */3 * * *" for
    # every 3 hours, or "0 6,18 * * *" for twice a day.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  # Lets you trigger a run manually from the Actions tab in GitHub.

permissions:
  contents: write
  # Required so the workflow can push the updated JSON file back
  # to the repo using the built-in GITHUB_TOKEN.

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ABL schedule scraper
        run: python abl_schedule_scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add abl_schedule.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ABL schedule data"
            git push
          fi
